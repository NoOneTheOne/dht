name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        binary: [spider, search, getpeers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        run: go build -ldflags "-s -w" -o build/dht-${{ matrix.binary }} ./cmd/${{ matrix.binary }}

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up config.yml from runner-local path
        run: |
          mkdir -p config
          if [ -f /volume/dht/config.yml ]; then
            cp /volume/dht/config.yml config/config.yml
            echo "config.yml copied from /volume/dht/"
          else
            echo "ERROR: /volume/dht/config.yml not found on runner."
            exit 1
          fi

      - name: Stop existing services
        run: docker compose down --remove-orphans || true

      - name: Build and start services
        run: |
          docker compose build
          docker compose up -d

      - name: Verify services are running
        run: |
          echo "Waiting for services to start..."
          for i in $(seq 1 12); do
            if docker compose ps --format json | grep -q '"running"'; then
              echo "Services are up!"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "ERROR: Services failed to start within 60 seconds"
              docker compose ps
              docker compose logs --tail=50
              exit 1
            fi
            sleep 5
          done
          echo "=== Docker Compose Status ==="
          docker compose ps

      - name: Cleanup unused images
        if: always()
        run: docker image prune -f
