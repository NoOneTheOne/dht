name: CI

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [lint, test]
    strategy:
      matrix:
        binary: [spider, search, getpeers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: go build -ldflags "-s -w" -o build/dht-${{ matrix.binary }} ./cmd/${{ matrix.binary }}
      - name: Validate Docker target
        env:
          TARGET: ${{ matrix.binary }}
          REVISION: ${{ github.sha }}
          BUILD_ENV: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'prod' || 'unknown' }}
        run: |
          version=""
          while IFS='=' read -r key value; do
            if [[ "$key" == DHT_IMAGE_TAG ]]; then version="$value"; fi
          done < .env.example
          [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          docker build --target "$TARGET" --build-arg VERSION="$version" --build-arg REVISION="$REVISION" --build-arg APP_ENV="$BUILD_ENV" .

  frontend:
    name: Build release frontend
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        working-directory: web
        run: |
          npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: release-frontend
          path: web/dist/
          if-no-files-found: error

  package:
    name: Package ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        exclude:
          - os: darwin
            arch: amd64
    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
      RELEASE_TAG: ${{ github.ref_name }}
      BUILD_ENV: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'prod' || 'unknown' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: release-frontend
          path: frontend-dist
      - name: Build and package binaries
        run: |
          version=""
          while IFS='=' read -r key value; do
            if [[ "$key" == DHT_IMAGE_TAG ]]; then version="$value"; fi
          done < .env.example
          [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$RELEASE_TAG" == "$version" ]]
          fi
          extension=""
          if [[ "$GOOS" == windows ]]; then extension=".exe"; fi
          mkdir -p dist
          for binary in spider search getpeers; do
            name="dht-${binary}_${version}_${GOOS}_${GOARCH}"
            directory="packages/$name"
            mkdir -p "$directory"
            go build -trimpath -ldflags "-s -w -X github.com/NoOneTheOne/dht/internal/logging.Version=$version -X github.com/NoOneTheOne/dht/internal/logging.Revision=$GITHUB_SHA -X github.com/NoOneTheOne/dht/internal/logging.Environment=$BUILD_ENV" -o "$directory/dht-${binary}${extension}" "./cmd/$binary"
            cp config/config.yml.example "$directory/config.yml.example"
            cp LICENSE "$directory/LICENSE"
            if [[ "$binary" == search ]]; then
              mkdir -p "$directory/web"
              cp -R frontend-dist/. "$directory/web/"
            fi
            if [[ "$GOOS" == windows ]]; then
              (cd packages && zip -qr "../dist/$name.zip" "$name")
            else
              tar -czf "dist/$name.tar.gz" -C packages "$name"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [build, package]
    if: github.ref_type == 'tag' && github.event_name == 'push'
    permissions:
      contents: write
    concurrency:
      group: dht-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version and main ancestry
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          expected=""
          while IFS='=' read -r key value; do
            if [[ "$key" == DHT_IMAGE_TAG ]]; then expected="$value"; fi
          done < .env.example
          [[ "$RELEASE_TAG" == "$expected" ]]
          git merge-base --is-ancestor "$RELEASE_REVISION" origin/main
      - uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          path: dist
          merge-multiple: true
      - name: Publish archives and checksums without overwriting a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          [[ "${#archives[@]}" == 15 ]] || {
            echo "ERROR: expected 15 release archives"
            exit 1
          }
          (cd dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS)
          gh release create "$RELEASE_TAG" "${archives[@]}" dist/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: [build]
    if: github.ref_type == 'tag' && github.event_name == 'push'
    concurrency:
      group: dht-production
      cancel-in-progress: false
    env:
      DHT_IMAGE_TAG: ${{ github.ref_name }}
      DHT_IMAGE_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version and main ancestry
        run: |
          [[ "$DHT_IMAGE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "ERROR: deployment requires a formal vX.Y.Z version"
            exit 1
          }
          expected=""
          while IFS='=' read -r key value; do
            if [[ "$key" == DHT_IMAGE_TAG ]]; then expected="$value"; fi
          done < .env.example
          [[ "$DHT_IMAGE_TAG" == "$expected" ]] || {
            echo "ERROR: Git tag does not match the project image version"
            exit 1
          }
          git merge-base --is-ancestor "$DHT_IMAGE_REVISION" origin/main

      - name: Prepare configuration
        run: |
          test -r /volume/dht/config.yml || {
            echo "ERROR: /volume/dht/config.yml is not readable on runner"
            exit 1
          }
          install -d -m 700 config
          install -m 644 /volume/dht/config.yml config/config.yml
          docker compose config --quiet

      - name: Build missing images without overwriting released tags
        run: |
          docker info > /dev/null
          for service in dht-spider dht-search; do
            running=$(docker ps --filter "name=^/$service$" --format '{{.ID}}')
            if [[ -n "$running" ]]; then
              current=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$running")
              if [[ "$current" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                newest=$(printf '%s\n' "$current" "$DHT_IMAGE_TAG" | sort -V | tail -n 1)
                [[ "$newest" == "$DHT_IMAGE_TAG" ]] || {
                  echo "ERROR: refusing to replace $current with older release $DHT_IMAGE_TAG"
                  exit 1
                }
              fi
            fi
            image="$service:$DHT_IMAGE_TAG"
            if docker image inspect "$image" > /dev/null 2>&1; then
              version=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")
              revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
              if [[ "$version" != "$DHT_IMAGE_TAG" || "$revision" != "$DHT_IMAGE_REVISION" ]]; then
                echo "ERROR: existing image $image belongs to another release; use a new version"
                exit 1
              fi
              echo "Reusing immutable image $image"
            else
              docker compose build "$service"
            fi
          done

      - name: Start and verify services
        run: |
          docker compose up -d --no-build --pull never --wait --wait-timeout 90
          for service in dht-spider dht-search; do
            container=$(docker compose ps -q "$service")
            test -n "$container"
            [[ "$(docker inspect --format '{{.State.Status}}' "$container")" == running ]]
            expected=$(docker image inspect --format '{{.Id}}' "$service:$DHT_IMAGE_TAG")
            actual=$(docker inspect --format '{{.Image}}' "$container")
            [[ "$actual" == "$expected" ]]
          done
          docker compose ps

      - name: Report deployment failure
        if: failure()
        run: docker compose ps --all
