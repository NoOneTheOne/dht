# MySQL settings shared by both services. Required values fail
# `docker compose config` early when missing; define them in .env.
x-mysql-env: &mysql-env
  DHT_MYSQL_ADDRESS: "${DHT_MYSQL_ADDRESS:?DHT_MYSQL_ADDRESS must be set (host:port)}"
  DHT_MYSQL_USER: "${DHT_MYSQL_USER:?DHT_MYSQL_USER must be set}"
  DHT_MYSQL_PASSWORD: "${DHT_MYSQL_PASSWORD:-}"
  DHT_MYSQL_DATABASE: "${DHT_MYSQL_DATABASE:?DHT_MYSQL_DATABASE must be set}"
  DHT_MYSQL_TABLE: "${DHT_MYSQL_TABLE:?DHT_MYSQL_TABLE must be set}"

services:
  dht-spider:
    image: dht-spider:${DHT_IMAGE_TAG:?DHT_IMAGE_TAG must be set}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${DHT_IMAGE_TAG:?DHT_IMAGE_TAG must be set}
        REVISION: ${DHT_IMAGE_REVISION:-local}
        APP_ENV: prod
      target: spider
    container_name: dht-spider
    environment:
      <<: *mysql-env
      APP_ENV: prod
      SPIDER_STATUS_ADDR: ":30081"
      # Extra DHT bootstrap nodes (host:port, comma-separated); built-ins are always used.
      DHT_BOOTSTRAP_NODES: "${DHT_BOOTSTRAP_NODES:-}"
      # Public IP other DHT nodes see (BEP-42 node ID). Empty: looked up at startup.
      DHT_PUBLIC_IP: "${DHT_PUBLIC_IP:-}"
    command:
      - ./dht-spider
      - -port=${DHT_PORT:-6881}
      - -query-workers=${DHT_QUERY_WORKERS:-512}
      - -query-timeout=${DHT_QUERY_TIMEOUT:-5s}
      - -metadata-workers=${DHT_METADATA_WORKERS:-64}
    ports:
      - "${DHT_PORT:-6881}:${DHT_PORT:-6881}/udp"
      # Crawler /status and /metrics, reachable from this host only.
      - "127.0.0.1:${SPIDER_STATUS_PORT:-30081}:30081"
    volumes:
      - spider-data:/app/data
    stop_grace_period: 60s
    restart: unless-stopped

  dht-search:
    image: dht-search:${DHT_IMAGE_TAG:?DHT_IMAGE_TAG must be set}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${DHT_IMAGE_TAG:?DHT_IMAGE_TAG must be set}
        REVISION: ${DHT_IMAGE_REVISION:-local}
        APP_ENV: prod
      target: search
    container_name: dht-search
    environment:
      SEARCH_API_PORT: "30080"
      <<: *mysql-env
      SPIDER_STATUS_URL: "http://dht-spider:30081/status"
      APP_ENV: prod
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "12", "-O", "/dev/null", "http://127.0.0.1:30080/health"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s
    ports:
      - "${SEARCH_PORT:-30080}:30080"
    restart: unless-stopped

volumes:
  spider-data:
