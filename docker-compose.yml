services:
  dht-spider:
    image: dht-spider:${DHT_IMAGE_TAG:?DHT_IMAGE_TAG must be set}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${DHT_IMAGE_TAG:?DHT_IMAGE_TAG must be set}
        REVISION: ${DHT_IMAGE_REVISION:-local}
      target: spider
    container_name: dht-spider
    environment:
      CONFIG_FILE_PATH: "/app/config.yml"
    command:
      - ./dht-spider
      - -port=${DHT_PORT:-6881}
      - -query-workers=${DHT_QUERY_WORKERS:-64}
      - -query-timeout=${DHT_QUERY_TIMEOUT:-5s}
      - -metadata-workers=${DHT_METADATA_WORKERS:-64}
    ports:
      - "${DHT_PORT:-6881}:${DHT_PORT:-6881}/udp"
    volumes:
      - ./config/config.yml:/app/config.yml:ro
    restart: unless-stopped

  dht-search:
    image: dht-search:${DHT_IMAGE_TAG:?DHT_IMAGE_TAG must be set}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${DHT_IMAGE_TAG:?DHT_IMAGE_TAG must be set}
        REVISION: ${DHT_IMAGE_REVISION:-local}
      target: search
    container_name: dht-search
    environment:
      SEARCH_API_PORT: "30080"
      CONFIG_FILE_PATH: "/app/config.yml"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:30080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "${SEARCH_PORT:-30080}:30080"
    volumes:
      - ./config/config.yml:/app/config.yml:ro
    restart: unless-stopped
