run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert

linters-settings:
  misspell:
    locale: US

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: internal/dht/bitmap_xorfast\.go
      linters:
        - govet
      text: "unsafe"
    - path: internal/metrics/metrics\.go
      linters:
        - unused
      text: "U1000"
