run:
  timeout: 5m
  go: "1.26"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - unconvert
    - unparam

linters-settings:
  govet:
    enable:
      - nilness
      - shadow
  revive:
    rules:
      - name: exported
        disabled: true
  misspell:
    locale: US

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unparam
    - path: internal/dht/bitmap_xorfast\.go
      linters:
        - govet
      text: "unsafe"
    - path: internal/metrics/metrics\.go
      linters:
        - unused
      text: "U1000"
