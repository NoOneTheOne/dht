<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#e2f8ed" />
    <script>
      (() => {
        let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try { const saved = localStorage.getItem('dht-theme'); if (saved === 'dark' || saved === 'light') theme = saved; } catch {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/search-icon.svg" />
    <meta name="description" content="检索 DHT 网络中的 BitTorrent 资源元数据，查看文件大小、收录时间并复制磁力链接。" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DHT Search</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
